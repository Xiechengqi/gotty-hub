name: Build and Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-latest
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:ui
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
  build:
    needs: frontend
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@cargo-zigbuild
      - name: Rust checks
        if: matrix.arch == 'amd64'
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked
          python3 tests/config.py
          python3 scripts/check-core.py
      - name: Build standalone binary
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}
      - name: Package release assets
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir release-files
          cp "target/$TARGET/release/gotty-hub" "release-files/gotty-hub-linux-$ARCH"
          cd release-files
          sha256sum "gotty-hub-linux-$ARCH" > "gotty-hub-linux-$ARCH.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: release-files/*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-files
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        run: |
          (cd release-files && sha256sum --check gotty-hub-linux-amd64.sha256)
          (cd release-files && sha256sum --check gotty-hub-linux-arm64.sha256)
          printf '%s\n' \
            "Commit: $COMMIT" \
            '' '### Linux amd64' '```sh' \
            "wget https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/gotty-hub-linux-amd64 -O /usr/local/bin/gotty-hub && chmod +x /usr/local/bin/gotty-hub" \
            '```' '' '### Linux arm64' '```sh' \
            "wget https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/gotty-hub-linux-arm64 -O /usr/local/bin/gotty-hub && chmod +x /usr/local/bin/gotty-hub" \
            '```' > "$RUNNER_TEMP/gotty-hub-release-notes.md"
          git tag --force latest "$COMMIT"
          git push --force origin refs/tags/latest
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest release-files/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit latest --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title latest --notes-file "$RUNNER_TEMP/gotty-hub-release-notes.md" --latest --draft=false --prerelease=false
          else
            gh release create latest release-files/* --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --verify-tag --title latest --notes-file "$RUNNER_TEMP/gotty-hub-release-notes.md" --latest
          fi
