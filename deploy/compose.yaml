services:
  hub:
    build: ..
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      HUB_PASSWORD: ${HUB_PASSWORD:?Set the admin password}
    volumes:
      - hub-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  hub-data:
